<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Juwenalia AT Tarnów 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="animated-bg"></div>

<nav class="glass-nav">
    <div class="logo">AT<span>Juwenalia</span></div>
</nav>

<section class="checkout-container glass-panel">
    <h1>Kup bilet 🎟️</h1>

    <form class="checkout-form">
        <label>Imię i nazwisko</label>
        <input type="text" placeholder="Jan Kowalski" required>

        <label>Email</label>
        <input type="email" placeholder="jan@email.com" required>

        <label>Typ biletu</label>
        <select>
            <option>Bilet standardowy - 50 zł</option>
            <option>VIP - 120 zł</option>
        </select>

        <label>Metoda płatności</label>
        <select>
            <option>Karta</option>
            <option>BLIK</option>
            <option>Przelew</option>
        </select>

        <button type="submit" class="cta-button">Zapłać</button>
    </form>
</section>

</body>
</html>
